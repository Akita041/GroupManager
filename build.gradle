// GroupManager — Gradle build
plugins {
    id 'java'
}

group = 'org.anjocaido.groupmanager'

def gitShortSha = {
    try {
        def sha = providers.exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            workingDir = projectDir
        }.standardOutput.asText.get().trim()
        return sha.isEmpty() ? null : sha
    } catch (Exception ignored) {
        return null
    }
}

version = "2.9.0-${gitShortSha() ?: 'dev'}"
def bukkitAPIVersion = '1.13'
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

repositories {
    mavenCentral()
    // Spigot API (snapshots)
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://repo.codemc.org/repository/maven-public' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
}

dependencies {
    // Bukkit/Spigot API
    compileOnly 'org.spigotmc:spigot-api:1.21.1-R0.1-SNAPSHOT'
    // PlaceholderAPI (latest release, official repo)
    compileOnly 'me.clip:placeholderapi:2.12.3'
    // bStats (latest 3.2.1; note: not referenced by any source file yet)
    compileOnly 'org.bstats:bstats-bukkit:3.2.1'
    // Non-Minecraft dependencies
    compileOnly 'org.jetbrains:annotations:26.1.0'
    compileOnly 'com.zaxxer:HikariCP:7.1.0'
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    testImplementation 'junit:junit:4.13.2'
}

processResources {
    filteringCharset = 'UTF-8'
    def projName = project.name
    def projVersion = project.version.toString()
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    with(copySpec {
        from 'src/main/resources'
        include 'plugin.yml'
        expand 'project': [
            name            : projName,
            version         : projVersion,
            bukkitAPIVersion: bukkitAPIVersion,
        ]
    })
}
